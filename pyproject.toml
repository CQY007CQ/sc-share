[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-lab"
version = "0.1.0"
description = "面向低年级学生的人工智能基础实践平台"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "SC Lab contributors"}]
dependencies = []

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
sc-lab = "sc_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

